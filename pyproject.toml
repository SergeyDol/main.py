[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
strict_optional = true
disallow_untyped_defs = false  # Временно отключаем требование типов для тестов

[[tool.mypy.overrides]]
module = [
    "requests.*",
    "pandas.*",
    "dotenv.*",
    "pytest.*"
]
ignore_missing_imports = true